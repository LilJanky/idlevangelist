/* PIXEL-FONT:END */
:root {
  --bg: #141010;
  --panel: #221c1e;
  --panel-2: #2c2528;
  --line: #433a3e;
  --text: #ece8dc;
  --muted: #a7a89f;
  --gold: #f2d98a;
  --gold-dark: #8a6e2a;
  --teal: #7fd0bc;
  --rose: #e49a8a;
  --blue: #8fb6e8;
  --good: #9ad07a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 20%, #271f22 0%, #0f0a0c 70%); color: var(--text); font-family: var(--mono); overflow: hidden; }
body { overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

#frame { height: 100dvh; width: 100vw; display: flex; align-items: center; justify-content: center; }
#app {
  position: relative; display: flex; flex-direction: column; overflow: hidden;
  width: min(100vw, 430px); height: min(100dvh, 932px);
  background: var(--bg); border-left: 1px solid #2f262a; border-right: 1px solid #2f262a;
}
@media (min-width: 520px) { #app { box-shadow: 0 0 60px rgba(0,0,0,.6); border: 1px solid #3b3235; border-radius: 6px; } }

/* ---- HUD ---- */
#hud {
  flex: 0 0 auto; display: grid; grid-template-columns: 9.25rem minmax(0, 1fr) 66px; /* the Seeds plate is a fixed width so it never changes size as the number moves */ align-items: stretch; gap: 6px;
  grid-template-areas:
    'seeds meta menu'
    'street street street';
  padding: calc(6px + var(--safe-top)) 8px 6px; background: linear-gradient(#1a1516, #1f191b); border-bottom: 2px solid #110c0d;
}
.stat { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 3px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.stat-line, #hud-main, #hud-meta { min-width: 0; }
.stat-line { display: flex; align-items: center; gap: 6px; }
.stat-main { justify-content: flex-start; }
.stat-main#stat-seeds { grid-area: seeds; }
.stat-icon { flex: 0 0 auto; width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center; }
.ui-icon { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.stat-label { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat-value { font-size: 17px; font-weight: 700; color: var(--gold); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#stat-funds .stat-value { color: var(--teal); }
.stat.faith .stat-value { color: var(--rose); }
.stat-rate { font-size: 10px; color: var(--muted); }
.icon-btn { flex: 0 0 auto; min-width: 48px; min-height: 44px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.icon-btn:active { background: #3b3236; }
#btn-settings { grid-area: menu; min-width: 66px; padding: 4px 6px; }
#hud-main { grid-area: meta; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
#hud-meta { display: flex; gap: 4px; flex-wrap: wrap; }
.stat-chip { flex: 1 1 0; padding: 2px 6px; }
.stat-chip .stat-label { font-size: 8px; }
.stat-chip .stat-value { font-size: 14px; }
.stat-chip .stat-rate { font-size: 9px; }

/* ---- Scene ---- */
#scene { position: relative; flex: 0 0 clamp(190px, 40%, 380px); overflow: hidden; background: #342c2e; touch-action: manipulation; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#encounter-card {
  --enc-portrait-scale: 1; --enc-portrait-size: calc(48px * var(--enc-portrait-scale));
  position: absolute; top: 35px; left: 8px; right: 8px; padding: 5px 7px 6px; background: rgba(12,14,20,.88); border: 1px solid #5d5457; border-radius: 4px;
  box-shadow: 0 2px 0 rgba(0,0,0,.4); pointer-events: none;
}
#encounter-card.special { border-color: var(--gold); }
#encounter-card.boss { border-color: var(--rose); }
.enc-main { display: grid; grid-template-columns: var(--enc-portrait-size) minmax(0,1fr); gap: 7px; align-items: start; }
.enc-copy { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.enc-portrait-frame {
  width: var(--enc-portrait-size); height: var(--enc-portrait-size); padding: 2px; align-self: start;
  border: 1px solid #9f8340; background: #161012; box-shadow: inset 0 0 0 1px #2a2112, inset 0 2px 0 rgba(255,241,200,.1), inset 0 -2px 0 rgba(0,0,0,.42);
}
#encounter-card.boss .enc-portrait-frame, .enc-portrait-frame.boss { border-color: #b1747c; box-shadow: inset 0 0 0 1px #322029, inset 0 2px 0 rgba(255,228,233,.1), inset 0 -2px 0 rgba(0,0,0,.42); }
#enc-portrait { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.enc-head { display: flex; justify-content: space-between; gap: 6px; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#enc-name { color: var(--text); font-weight: 700; }
#enc-label { text-align: right; }
#encounter-card p { margin: 1px 0 2px; font-size: 12px; line-height: 1.2; color: #f4efe0; min-height: 2.4em; }
.meter { display: flex; align-items: center; gap: 5px; font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 1px; }
.meter-label { flex: 0 0 54px; }
.meter-track { flex: 1; height: 9px; background: #0d080a; border: 1px solid #4e4448; border-radius: 2px; overflow: hidden; }
.meter-fill { height: 100%; width: 100%; background: repeating-linear-gradient(90deg, var(--rose) 0 6px, #cc8374 6px 8px); transition: width .12s linear; }
.meter-fill.time { background: repeating-linear-gradient(90deg, var(--blue) 0 6px, #7aa0d4 6px 8px); }
.meter-num { flex: 0 0 38px; text-align: right; color: var(--text); font-size: 10px; }
#floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; font-weight: 800; font-size: 15px; color: #fff4c8; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; white-space: nowrap; animation: floatUp .85s ease-out forwards; transform: translate(-50%, 0); }
.floater.crit { font-size: 20px; color: var(--gold); }
.floater.word { color: #bfe6ff; }
.floater.reward { color: var(--good); font-size: 14px; }
.floater.funds { color: var(--teal); font-size: 13px; }
.floater.helper { color: #cfd8ea; font-size: 12px; font-weight: 600; }
@keyframes floatUp { 0% { opacity: 0; margin-top: 6px; } 12% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }
body.reduce-motion .floater { animation: fadeOnly .7s linear forwards; }
@keyframes fadeOnly { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
#toasts { position: absolute; left: 8px; right: 8px; bottom: 34px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; align-items: center; }
.toast { padding: 5px 9px; background: rgba(12,14,20,.9); border: 1px solid #5d5457; border-radius: 3px; font-size: 11px; line-height: 1.3; text-align: center; animation: toastIn .25s ease-out; max-width: 100%; }
.toast.gold { border-color: var(--gold); color: var(--gold); }
body.reduce-motion .toast { animation: none; }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#moment { position: absolute; left: 8px; right: 8px; top: 36px; padding: 10px 12px; background: #120d0e; border: 1px solid var(--gold); border-radius: 4px; text-align: center; font-size: 12px; line-height: 1.4; }
#moment h3 { margin: 0 0 4px; color: var(--gold); font-size: 15px; letter-spacing: .04em; }
#moment .ref { color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; display: block; }
#moment .small { color: var(--muted); font-size: 10px; margin-top: 6px; }
#moment .quote { color: #d8d4c4; font-size: 11.5px; line-height: 1.4; margin-top: 4px; font-style: italic; }
#moment.boss-dialog { border-color: var(--rose); }
#moment .row-btns { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
#tap-hint { position: absolute; left: 50%; bottom: 42%; transform: translateX(-50%); padding: 4px 10px; background: rgba(12,14,20,.8); border: 1px dashed var(--gold); color: var(--gold); font-size: 11px; border-radius: 3px; animation: pulse 1.4s ease-in-out infinite; pointer-events: none; }
body.reduce-motion #tap-hint { animation: none; }
@keyframes pulse { 50% { opacity: .45; } }


/* ---- Street HUD: Active Witness streak + Momentum / Stand Firm ---- */
#street-hud { grid-area: street; display: flex; gap: 4px; min-width: 0; pointer-events: none; }
.sh-streak, .sh-momentum { display: flex; align-items: center; gap: 5px; padding: 4px 6px; background: rgba(12,14,20,.84); border: 1px solid #5d5457; border-radius: 4px; min-height: 28px; font-size: 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-width: 0; }
.sh-streak { flex: 0 0 auto; }
.sh-label { white-space: nowrap; }
.sh-streak b { font-size: 13px; color: var(--text); min-width: 34px; }
.sh-streak { --k: 0; position: relative; }
.sh-fuse { position: absolute; left: 7px; right: 7px; bottom: 2px; height: 3px; border-radius: 1px; opacity: 0; --fuse: #9be08a; background: linear-gradient(to right, var(--fuse) calc(var(--f, 0) * 100%), rgba(0, 0, 0, .5) 0); transition: opacity .2s; }
.sh-streak.has-run .sh-fuse { opacity: 1; }
.sh-streak.low { --fuse: #ffb454; }
.sh-streak.urgent { --fuse: #ff6a5a; }
.sh-streak.urgent b { animation: urgentPulse .4s ease-in-out infinite; }
.sh-streak.drop { animation: runDrop .35s ease-out; }
@keyframes runDrop { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes urgentPulse { 50% { opacity: .55; } }
body.reduce-motion .sh-streak.drop, body.reduce-motion .sh-streak.urgent b { animation: none; }
.sh-streak b { font-size: calc(13px + 11px * var(--k)); line-height: 1; color: hsl(calc(110 - 95 * var(--k)) 80% calc(72% - 4% * var(--k))); text-shadow: 0 0 calc(12px * var(--k)) hsl(calc(110 - 95 * var(--k)) 100% 60% / .9); transition: font-size .25s ease-out; }
.sh-streak small { font-size: 10px; letter-spacing: .02em; color: var(--muted); }
.sh-streak { border-color: hsl(calc(110 - 95 * var(--k)) 35% calc(32% + 22% * var(--k))); }
.sh-pips { display: inline-flex; gap: 2px; }
.sh-pips i { width: 5px; height: 8px; background: #0d080a; border: 1px solid #4e4448; }
.sh-pips i.on { background: var(--gold); border-color: var(--gold); }
.sh-momentum { flex: 1; min-width: 0; }
.sh-momentum .sh-label { flex: 0 0 auto; }
.sh-track { flex: 1; height: 9px; background: #0d080a; border: 1px solid #4e4448; border-radius: 2px; overflow: hidden; }
.sh-fill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--teal) 0 6px, #5fb4a0 6px 8px); }
.sh-momentum.firm { border-color: var(--gold); color: var(--gold); }
.sh-momentum.firm .sh-fill { background: repeating-linear-gradient(90deg, var(--gold) 0 6px, #e6b94a 6px 8px); }
.sh-momentum.firm .sh-label { font-weight: 800; }
body:not(.reduce-motion) .sh-momentum.firm { animation: pulseBorder 0.8s ease-in-out infinite; }
.sh-streak.bump b { animation: bump .35s ease-out; }
body.reduce-motion .sh-streak.bump b { animation: none; }
@keyframes bump { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
.floater.engage { color: var(--good); font-size: 14px; }
.floater.engage.crit { color: var(--gold); font-size: 18px; }
.floater.minitick { color: #f2e7c0; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.floater.timely { color: var(--gold); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
#v-seeds.pulse { animation: seedPulse .35s ease-out; }
body.reduce-motion #v-seeds.pulse { animation: none; }
@keyframes seedPulse { 0% { transform: scale(1.12); color: #fff6c8; } 100% { transform: scale(1); } }
.stat-rate.changing { color: var(--good); font-weight: 800; }
#stat-seeds .stat-rate { min-height: 12px; }
#action-row .action { min-height: 72px; }

/* The street tab gives the scene all remaining room (the street is the game); list tabs keep a compact scene. */
#app[data-tab=street] #scene { flex: 1 1 0; min-height: 200px; }
#app[data-tab=street] #panel { flex: 0 0 auto; overflow: visible; }

/* ---- Panel ---- */
#panel { position: relative; flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; background: var(--panel); border-top: 2px solid #110c0d; -webkit-overflow-scrolling: touch; }
.tab { padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 100%; }
#tab-street::before { content: ''; margin-top: auto; }
#street-top-row { display: flex; gap: 8px; align-items: stretch; }
.ministry-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 4px; }
.ministry-strip button { min-height: 36px; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 2px 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; font-weight: 700; color: var(--text); min-width: 0; }
.ministry-strip button.on { border-color: #566851; }
.ministry-strip .sc { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
.ministry-strip .sc b { font-size: 11px; }
.ministry-strip .sc i { font-style: normal; font-size: 8px; color: var(--gold); }
.street-status { display: flex; flex-direction: column; justify-content: space-between; gap: 6px; flex: 1 1 54%; min-width: 0; padding: 6px 8px; font-size: 10px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; background: var(--panel-2); border: 1px solid var(--line); }
.street-status b { color: var(--text); }
#action-row { flex: 0 0 46%; min-width: 0; display: flex; gap: 6px; }
#action-row.has-answer { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.action { position: relative; overflow: hidden; border: 2px solid #110c0d; border-radius: 6px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-transform: uppercase; letter-spacing: .08em; }
.action.primary { width: 100%; min-height: 84px; flex: 1 1 auto; max-height: 120px; background: linear-gradient(#e7c565, #b8913a); color: #1d1608; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 3px 0 #110c0d; }
.action.primary:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25), 0 1px 0 #110c0d; }
.action.primary:disabled { filter: grayscale(.7) brightness(.6); }
.action.secondary { flex: 1; min-height: 52px; background: linear-gradient(#584d50, #463a3e); color: #eaf0ff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.3), 0 2px 0 #110c0d; }
.action.secondary:disabled { filter: grayscale(.8) brightness(.65); }
.a-title { font-size: 18px; font-weight: 800; }
.secondary .a-title { font-size: 14px; }
.a-sub { font-size: 10px; opacity: .85; letter-spacing: .04em; text-transform: none; }
.cd { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--teal); }
#word-tray { position: absolute; left: 8px; right: 8px; z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; background: rgba(10,12,18,.96); border: 1px solid #605358; border-radius: 6px; box-shadow: 0 -4px 14px rgba(0,0,0,.5); }
.verse-btn { position: relative; overflow: hidden; text-align: left; padding: 5px 6px; min-height: 50px; background: #362c30; border: 1px solid #605358; border-radius: 4px; }
.verse-btn .v-ref { font-size: 11px; color: var(--blue); font-weight: 700; white-space: nowrap; }
.verse-btn .v-name { font-size: 10px; color: var(--text); display: block; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.verse-btn .v-fit { position: absolute; top: 3px; right: 3px; font-size: 8px; padding: 0 3px; border-radius: 2px; background: var(--gold); color: #231a06; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.verse-btn.fits { border-color: var(--gold); }
.verse-btn:disabled { opacity: .5; }
.verse-btn .cd { background: var(--blue); }
#boss-row { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 9px; border: 1px solid var(--rose); background: rgba(40,26,32,.96); border-radius: 4px; font-size: 11px; line-height: 1.3; }
#boss-row .b-text { flex: 1; min-width: 0; }
#boss-row .btn { flex: 0 0 auto; min-height: 40px; }
#boss-row.available { animation: pulseBorder 1.6s ease-in-out infinite; }
body.reduce-motion #boss-row.available { animation: none; }
@keyframes pulseBorder { 50% { border-color: var(--gold); } }
#boss-row .b-title { font-weight: 800; color: var(--rose); letter-spacing: .06em; text-transform: uppercase; }
#boss-row .b-prep { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
#boss-row .b-prep .meter-track { height: 6px; flex: 0 0 56px; }
#boss-row .b-prep .meter-fill { background: var(--teal); transition: none; }
.btn { min-height: 44px; padding: 6px 12px; border: 2px solid #110c0d; border-radius: 5px; background: linear-gradient(#566851, #3e4e3a); color: #f0fff4; font-weight: 800; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; box-shadow: inset 0 -3px 0 rgba(0,0,0,.28); }
.btn:active { transform: translateY(1px); }
.btn:disabled { filter: grayscale(.8) brightness(.6); cursor: default; }
.btn.gold { background: linear-gradient(#e7c565, #b8913a); color: #1d1608; }
.btn.rose { background: linear-gradient(#b8665a, #8a4238); color: #fff2ee; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); box-shadow: none; }
.btn.small { min-height: 36px; padding: 4px 8px; font-size: 11px; }


/* ---- Ministry legibility ---- */
.passive-summary { padding: 8px 10px; background: #2b2326; border: 1px solid #4f4448; border-radius: 4px; }
.passive-summary .ps-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.passive-summary .ps-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.passive-summary .ps-total { font-size: 20px; font-weight: 800; color: var(--gold); }
.passive-summary .ps-total.up { color: var(--good); }
.ps-bar { display: flex; height: 8px; margin-top: 6px; border: 1px solid #110c0d; background: #0d080a; }
.ps-bar i { display: block; height: 100%; }
.ps-legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 5px; font-size: 10px; color: var(--muted); }
.ps-legend span::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 4px; background: var(--c, #888); }
.row .prod { font-size: 13px; font-weight: 800; color: var(--gold); }
.row .prod small { color: var(--muted); font-weight: 600; font-size: 10px; margin-left: 4px; }
.row .nextprod { font-size: 10.5px; color: var(--good); }
.row.pulse { animation: rowPulse .6s ease-out; }
body.reduce-motion .row.pulse { animation: none; }
@keyframes rowPulse { 0% { border-color: var(--gold); background: #2b2f20; } 100% { border-color: var(--line); background: var(--panel-2); } }
.row .tickflash { color: var(--good); font-weight: 800; font-size: 11px; margin-left: 6px; }

/* ---- Lists ---- */
.section-title { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 4px 2px 0; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.buy-modes { display: flex; gap: 4px; }
.buy-modes button { min-width: 44px; min-height: 32px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 3px; font-size: 11px; }
.buy-modes button.on { background: var(--gold); color: #231a06; border-color: var(--gold); font-weight: 800; }
.row { display: flex; gap: 8px; align-items: center; padding: 7px 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
.row.locked { opacity: .55; }
.row .ico { flex: 0 0 28px; display: flex; justify-content: center; }
.row .info { flex: 1; min-width: 0; }
.row .name { font-size: 13px; font-weight: 700; display: flex; gap: 6px; align-items: baseline; }
.row .name small { color: var(--gold); font-size: 11px; }
.row .desc { font-size: 10.5px; color: var(--muted); line-height: 1.3; }
.row .buy { flex: 0 0 auto; min-width: 84px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #110c0d; border-radius: 5px; background: linear-gradient(#566851, #3e4e3a); font-size: 11px; font-weight: 800; box-shadow: inset 0 -3px 0 rgba(0,0,0,.28); }
.row .buy small { font-weight: 600; font-size: 10px; opacity: .9; }
.row .buy:disabled { background: #383032; color: #8c8f98; box-shadow: none; }
.row .buy.funds { background: linear-gradient(#677a5c, #495641); }
.row .buy.funds:disabled { background: #383032; }
.row .buy.armed { background: linear-gradient(#d4aa4a, #a07c26); color: #231a06; }
.chip { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.chip.funds { border-color: var(--teal); color: var(--teal); }
.note { font-size: 11px; color: var(--muted); line-height: 1.4; padding: 6px 8px; border-left: 3px solid var(--line); background: #261f22; }
.note.verse { border-left-color: var(--gold); }
.note b { color: var(--text); }
.assign { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.assign button { min-height: 32px; padding: 2px 8px; border: 1px solid var(--line); background: #1f191b; border-radius: 3px; font-size: 10px; }
.assign button.on { background: var(--teal); color: #161f10; border-color: var(--teal); font-weight: 800; }
.badge { position: absolute; top: 6px; left: calc(50% + 14px); width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px #1a1516; }

/* ---- Nav ---- */
#nav { flex: 0 0 auto; display: flex; gap: 6px; background: #1a1516; border-top: 2px solid #110c0d; padding: 6px 8px calc(6px + var(--safe-bottom)); }
.nav-btn { position: relative; flex: 1; min-height: 68px; border: 1px solid var(--line); background: #1f191b; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 6px 4px 5px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nav-btn.active { color: var(--gold); background: #2a2224; box-shadow: inset 0 0 0 2px var(--gold), inset 0 3px 0 #f3d98a, inset 0 -4px 0 #7e5f21; }
.nav-ico { display: flex; height: 24px; }
.nav-ico canvas { width: 24px; height: 24px; }

/* ---- Overlays ---- */
#overlay { position: absolute; inset: 0; z-index: 50; background: rgba(5,6,10,.82); display: flex; align-items: center; justify-content: center; padding: 14px; padding-top: calc(14px + var(--safe-top)); padding-bottom: calc(14px + var(--safe-bottom)); }
.modal { width: 100%; max-height: 100%; overflow-y: auto; background: var(--panel); border: 2px solid #4d4347; border-radius: 6px; padding: 14px; box-shadow: 0 6px 0 rgba(0,0,0,.4); display: flex; flex-direction: column; gap: 10px; }
.modal h2 { margin: 0; font-size: 18px; color: var(--gold); letter-spacing: .06em; text-transform: uppercase; }
.modal h3 { margin: 4px 0 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.modal p { margin: 0; font-size: 13px; line-height: 1.5; }
.modal .verse { padding: 8px 10px; border-left: 3px solid var(--gold); background: #261f22; font-size: 12px; line-height: 1.5; }
.modal .verse span { display: block; color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-top: 3px; }
.modal .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.modal .btns .btn { flex: 1; }
.stat-grid { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 12px; }
.stat-grid dt { color: var(--muted); }
.stat-grid dd { margin: 0; text-align: right; color: var(--text); font-weight: 700; }
.faith-reveal { text-align: center; padding: 10px; border: 1px solid var(--rose); border-radius: 4px; background: #251c20; }
.faith-reveal .big { font-size: 34px; font-weight: 800; color: var(--rose); line-height: 1; }
.breakdown { font-size: 11px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; margin-top: 8px; }
.breakdown .off { color: var(--muted); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; font-size: 12px; }
.setting input[type=range] { flex: 1; max-width: 160px; accent-color: var(--gold); min-height: 32px; }
.setting .toggle { min-width: 64px; min-height: 36px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 3px; font-size: 11px; }
.setting .toggle.on { background: var(--teal); color: #161f10; font-weight: 800; border-color: var(--teal); }
.debug-box { border: 1px dashed #c0705a; border-radius: 4px; padding: 8px; background: #231915; }
.debug-box h3 { color: #e8a08a; }
.debug-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 6px; }
.debug-grid .btn { min-height: 36px; font-size: 10px; padding: 3px 6px; }
.debug-out { margin-top: 6px; font-size: 10px; max-height: 120px; overflow: auto; white-space: pre-wrap; color: #d8c0b8; user-select: text; }
.version { text-align: center; color: var(--muted); font-size: 10px; padding: 4px; }

/* ---- Legacy / prestige ---- */
.branch { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.branch > h4 { margin: 0; padding: 5px 8px; font-size: 11px; letter-spacing: .14em; background: #33282d; color: var(--blue); }
.branch.work > h4 { background: #2a3328; color: var(--good); }
.branch.generations > h4 { background: #332a2a; color: var(--rose); }
.branch .row { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.faith-reveal .desc { font-size: 11px; color: var(--muted); }
.preview-card { border: 1px solid var(--gold); background: #1f1c14; border-radius: 4px; padding: 10px; font-size: 12px; line-height: 1.5; }
.preview-card h3 { margin: 0 0 4px; color: var(--gold); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }

/* ---- Montage ---- */
#montage { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56% 16px calc(70px + var(--safe-bottom)); text-align: center; pointer-events: auto; background: linear-gradient(transparent 0, transparent 55%, rgba(8,10,16,.97) 62%); }
#montage .beat { font-size: 17px; line-height: 1.4; text-shadow: 0 2px 0 #000; max-width: 320px; animation: toastIn .8s ease-out; }
#montage .psalm { margin-top: 12px; padding: 8px 10px; border: 1px solid var(--gold); background: rgba(10,12,18,.8); font-size: 13px; line-height: 1.5; max-width: 340px; }
#montage .psalm span { display: block; margin-top: 4px; font-size: 10px; color: var(--gold); letter-spacing: .1em; text-transform: uppercase; }
#montage .title { font-size: 34px; font-weight: 800; letter-spacing: .12em; color: var(--gold); text-shadow: 0 3px 0 #000; animation: toastIn 1s ease-out; }
#montage .skip { position: absolute; top: calc(66px + var(--safe-top)); right: 10px; background: rgba(8,10,16,.7); }
body.reduce-motion #montage .beat, body.reduce-motion #montage .title { animation: none; }

#scene.has-moment #toasts, #scene.has-moment #tap-hint { display: none; }
#scene.has-boss #toasts { bottom: 66px; }
@media (max-height: 720px) {
  #scene { flex-basis: clamp(170px, 36%, 300px); }
}
@media (min-width: 380px) {
  #encounter-card { --enc-portrait-scale: 2; }
  #encounter-card p { font-size: 11px; line-height: 1.16; min-height: 3.4em; }
  .enc-head { font-size: 8px; }
  .meter { font-size: 7px; }
  .meter-label { flex-basis: 48px; }
}
@media (max-height: 640px) {
  .a-title { font-size: 16px; }
  .action.primary { min-height: 58px; }
  .action.secondary { min-height: 44px; }
  .tab { gap: 6px; padding: 6px 8px 8px; }
  #encounter-card p { font-size: 11px; min-height: 2.3em; }
  #moment { font-size: 11px; padding: 7px 9px; }
  #moment h3 { font-size: 13px; }
  #moment p { margin: 3px 0; }
  .stat-value { font-size: 15px; }
}
@media (max-width: 360px) {
  #hud { grid-template-columns: 7.5rem minmax(0, 1fr) 58px; gap: 4px; padding-left: 5px; padding-right: 5px; }
  #btn-settings { min-width: 58px; font-size: 9px; }
  #street-hud { gap: 3px; }
  .sh-streak, .sh-momentum { gap: 4px; padding-left: 5px; padding-right: 5px; }
  #street-top-row { gap: 6px; }
  #action-row { flex-basis: 44%; }
  .goal-text { font-size: 11px; }
  #nav { gap: 4px; padding-left: 5px; padding-right: 5px; }
  .nav-btn { min-height: 62px; font-size: 9px; gap: 4px; padding-left: 2px; padding-right: 2px; }
}
@media (max-width: 340px) {
  .stat { padding: 2px 5px; }
  .stat-value { font-size: 14px; }
  .row .buy { min-width: 72px; }
  #hud { gap: 4px; padding-left: 5px; padding-right: 5px; }
  #encounter-card { top: 7px; left: 4px; right: 4px; padding: 4px 5px 5px; }
  .enc-main { gap: 5px; }
  .enc-portrait-frame { padding: 1px; }
  .enc-head { font-size: 7px; gap: 4px; }
  #enc-label { max-width: 82px; }
  #encounter-card p { font-size: 10px; line-height: 1.08; min-height: 3.2em; }
  .meter { font-size: 6px; gap: 4px; }
  .meter-label { flex-basis: 42px; }
  #street-hud { flex-wrap: wrap; }
  #street-top-row { flex-direction: column; }
  #action-row { flex-basis: auto; }
}

/* ---- WORD (street proclamation) and conversations ---- */
#btn-word { min-height: 64px; flex: 1 1 auto; }
#btn-word .a-title, #btn-word .a-sub { position: relative; z-index: 1; }
#btn-word .cd { height: 100%; width: 0; background: var(--gold); opacity: .3; z-index: 0; transition: width .15s linear; }
#btn-word.charging { background: linear-gradient(#483c40, #382d32); }
#btn-word.ready { background: linear-gradient(#e7c565, #b8913a); color: #1d1608; border-color: #110c0d; }
#btn-word.ready .cd { opacity: 0; }
#btn-word.ready .a-title { font-size: 20px; }
body:not(.reduce-motion) #btn-word.ready { animation: wordReady 1s ease-in-out infinite; }
@keyframes wordReady { 50% { box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 0 var(--glow-r, 14px) var(--glow-s, 2px) rgba(242,217,138,var(--glow-a, .65)); } }
/* The street at its fullest and starting to thin: the moment to proclaim. */
#btn-word.ready.crest { background: linear-gradient(#fff6c0, #e0b955); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), 0 0 26px 8px rgba(255, 246, 190, .95); }
body:not(.reduce-motion) #btn-word.ready.crest { animation: crestSweep .6s ease-in-out infinite; }
@keyframes crestSweep { 50% { filter: brightness(1.3); transform: scale(1.015); } }
/* A bigger street lights the button up in steps: gathering, crowd, full street, throng. */
#btn-word.ready.crowd-t1 { --glow-r: 16px; --glow-s: 3px; }
#btn-word.ready.crowd-t2 { --glow-r: 20px; --glow-s: 5px; --glow-a: .75; background: linear-gradient(#f0cf72, #c29a3c); }

/* The big number when WORD lands */
#word-slam { position: absolute; left: 0; right: 0; top: 7%; z-index: 5; text-align: center; pointer-events: none; font-weight: 900; text-transform: uppercase; transition: opacity .4s ease-out; animation: slamIn .34s cubic-bezier(.2, 1.5, .4, 1); }
#word-slam .ws-tier { font-size: 11px; letter-spacing: .2em; color: #ffe9a8; text-shadow: 0 1px 0 #000; min-height: 14px; }

#word-slam .ws-crest:empty { display: none; }
#word-slam .ws-sub { font-size: 11px; letter-spacing: .12em; color: #e8dcae; text-shadow: 0 1px 0 #000; }
#word-slam .ws-sub:empty { display: none; }
#word-slam .ws-mult { display: none; font-size: 30px; line-height: 1.05; color: #fff4c8; text-shadow: 0 0 16px rgba(255, 214, 120, .95), 0 3px 0 #000; animation: slamFlash .45s ease-in-out 3; }
#word-slam.has-mult .ws-mult { display: block; }
#word-slam .ws-total { font-size: 30px; line-height: 1.1; color: var(--gold); text-shadow: 0 0 10px rgba(255, 214, 120, .8), 0 2px 0 #000; }

@keyframes slamIn { 0% { transform: scale(2.6); opacity: 0; } 55% { opacity: 1; } 100% { transform: scale(1); } }
@keyframes slamFlash { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.9); } }

/* ================= Art direction: the interface is made of the same stuff as the world =================
   One pixel language: square SNES-style windows with a double border and hard two-tone bevels, flat colour instead of gradients,
   and a pixel font (see tools/make-pixel-font.py) for numbers, which are the heart of an idle game. Long text stays monospace. */
:root { --win-hi: rgba(255,255,255,.08); --win-lo: rgba(0,0,0,.42); --ink: #0d080a; }

.stat, .icon-btn, #encounter-card, .toast, #moment, #tap-hint, .sh-streak, .sh-momentum, .row, .modal, .faith-reveal, .passive-summary,
.verse-card, #verse-pop, .fork, .preview-card, .branch, .debug-box, #boss-row, #word-tray, .choice { border-radius: 0; }
.stat, .icon-btn, .row, .passive-summary, .faith-reveal, .preview-card, .branch, .fork, .choice, .verse-card, #street-status, .nav-btn {
  box-shadow: inset 0 2px 0 var(--win-hi), inset 0 -2px 0 var(--win-lo), 0 0 0 1px var(--ink);
}
#encounter-card, .toast, #moment, .modal, #verse-pop, #boss-row { box-shadow: inset 0 0 0 1px var(--ink), inset 0 2px 0 var(--win-hi), 0 0 0 1px var(--ink), 0 3px 0 rgba(0,0,0,.45); }
.meter-track, .goal-track, .sh-track, .sh-fuse { border-radius: 0; }
.ministry-strip button, .action, .verse-btn, .btn, .row .buy, .buy-modes button, .assign button, .setting .toggle, .chip, .ch-key, .cb-skip, .nav-btn { border-radius: 0; }

#btn-word.ready.crowd-t2 { background: #f0cf72; }

/* ================= Interface polish: framing, a real charge gauge, a clearer goal, a title with presence ================= */
#scene { border-bottom: 3px solid #110c0d; box-shadow: 0 1px 0 #4d4347; }
#scene::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(rgba(6,8,14,.5), rgba(6,8,14,0) 22px, rgba(6,8,14,0) calc(100% - 26px), rgba(6,8,14,.5)); }

/* the goal reads in full (two lines) and its bar is a chunky segmented gauge */
.goal-text { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
.goal-label::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' shape-rendering='crispEdges'><rect x='5' y='6' width='2' height='5' fill='%236a9a4a'/><rect x='3' y='3' width='3' height='3' fill='%238aba5a'/><rect x='6' y='2' width='3' height='3' fill='%239ada6a'/></svg>") center / contain no-repeat; image-rendering: pixelated; }
.goal-track { height: 9px; }
.goal-track i { background: repeating-linear-gradient(90deg, #e8c460 0 6px, #b8913a 6px 8px); box-shadow: inset 0 2px 0 rgba(255,255,255,.25); }

/* Proclaim the Word while it charges: a dark gauge that fills with gold segments, with the book beside its status */
#btn-word.charging { background: #2d2327; box-shadow: inset 0 3px 0 #4a3d42, inset 0 -4px 0 #191315, 0 2px 0 var(--ink); }
#btn-word .cd { background: repeating-linear-gradient(90deg, #e8c460 0 6px, #b8913a 6px 8px); opacity: .5; height: 100%; }

/* navigation: the active tab gets a gold notch */

/* title screen: lighter veil so the city shows, an emblem, and a button that breathes */

/* ---- Interface polish 2: ministry and upgrade cards ---- */
.passive-summary { padding: 10px 12px; background: #2d2528; border: 2px solid #110c0d; box-shadow: inset 0 0 0 1px #584a50, inset 0 3px 0 rgba(255,255,255,.05); }

/* ---- Warm lamplit voice: reading text in a book serif, interface chrome stays in the small mono face ---- */
:root { --serif: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Times New Roman', serif; }
#enc-statement, .row .desc, .row .effect, .note, .modal p, .choice, #tap-hint, #verse-pop .vp-text, #moment p, .toast, #boss-row .b-text {

/* ================= Paper and leather =================
   The lower half of the screen is a worn leather satchel with tract-paper cards pinned in it; the scene stays a lit window onto the city. */
:root { --paper: #f0e2bf; --paper-2: #e7d5a9; --paper-edge: #b79a64; --paper-ink: #2c1c10; --paper-soft: #6e5636; --paper-gold: #8f5e10; --paper-green: #2c6a2c; --leather: #2b1e18; --leather-2: #382920; --stitch: #7d5f3e; }
#panel { background: var(--leather); background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px); border-top: 3px solid #0e0806; box-shadow: inset 0 3px 0 #4a352a; }
#nav { background: #1d1410; border-top: 3px solid #0e0806; }
.nav-btn { background: var(--leather-2); border: 2px solid #0e0806; box-shadow: inset 0 0 0 1px var(--stitch); color: #c9b08a; }
.nav-btn.active { background: var(--paper); color: var(--paper-ink); box-shadow: inset 0 0 0 2px var(--paper-edge), 0 -2px 0 #0e0806; }
.nav-btn.active::before { top: -6px; width: 14px; height: 10px; margin-left: -7px; background: #b3262e; box-shadow: inset 0 -3px 0 #7c1820; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 70%, 0 100%); }
.section-title, .tab > .section-title span { color: #cfb48a; }
.buy-modes button { background: var(--leather-2); border: 2px solid #0e0806; color: #d8c29c; }
.buy-modes button.on { background: var(--paper); color: var(--paper-ink); }

/* paper cards */
.row, .passive-summary, .choice, .note, #preview-card, .street-status, .ministry-strip > *, #boss-row {
  background: var(--paper); color: var(--paper-ink); border: 2px solid #0e0806;
  box-shadow: inset 0 0 0 1px var(--paper-edge), inset 0 3px 0 rgba(255,255,255,.35), 0 3px 0 #0e0806;
}
.row { border-left: 8px solid var(--stripe, var(--paper-edge)); }
.row.up-row:not(.can) { opacity: 1; background: var(--paper-2); }
.row.up-row.can { background: var(--paper); box-shadow: inset 0 0 0 2px var(--stripe), inset 0 3px 0 rgba(255,255,255,.35), 0 3px 0 #0e0806; }
.row .name, .row .name small { color: var(--paper-ink); }
.row .name small { color: var(--paper-gold); }
.row .desc, .row .perf, .note, .passive-summary .ps-label, .ps-legend { color: var(--paper-soft); }
.row .effect, .row .nextprod, .row .tickflash, .row .eta { color: var(--paper-green); }
.row .prod b, .passive-summary .ps-total b { color: var(--paper-gold); }
.row .prod small, .passive-summary .ps-total small { color: var(--paper-soft); }
.row.up-row .chip { background: color-mix(in srgb, var(--stripe) 85%, #000); color: #fff6dc; }
.row.up-row .chip.best { background: #b3262e; color: #fff6dc; }
.ps-bar { background: #3a2a1c; border-color: #0e0806; }
.choice { color: var(--paper-ink); }
.choice:active { background: var(--paper-2); }
.note { border-left-color: var(--paper-gold); }

.row .buy, .row .buy small { color: #f4ffe8; }
.row .buy:disabled, .row .buy:disabled small { color: #9d9484; }
.row .buy.armed, .row .buy.armed small { color: #231a06; }
.street-status, .street-status * { color: var(--paper-ink); }
.street-status .goal-label { color: var(--paper-gold); }
.street-status .goal-track { background: #3a2a1c; border-color: #0e0806; }
.street-status .sh-streak b { color: var(--paper-gold); }
.street-status .goal-text { font-family: var(--serif); font-size: .88rem; }
#encounter-card { background: var(--paper); border: 2px solid #0e0806; box-shadow: inset 0 0 0 2px var(--paper-edge), 0 4px 0 rgba(0,0,0,.5); }
#encounter-card.special { box-shadow: inset 0 0 0 2px #c79a2e, 0 4px 0 rgba(0,0,0,.5); }
#encounter-card.boss { box-shadow: inset 0 0 0 2px #b3262e, 0 4px 0 rgba(0,0,0,.5); }
#encounter-card p, #enc-statement { color: var(--paper-ink); }
#enc-name { color: var(--paper-ink); }
.enc-head, #enc-label, .meter-label, .meter-num { color: var(--paper-soft); }
#encounter-card .meter-track { background: #3a2a1c; border-color: #0e0806; }
#hud { background: linear-gradient(#2f2119, #241812); border-bottom: 3px solid #0e0806; box-shadow: inset 0 -2px 0 #4a352a; }
.stat, .icon-btn { background: #1d1410; border: 2px solid #0e0806; box-shadow: inset 0 0 0 1px var(--stitch); }

@keyframes rowPulse { 0% { background: #f8e6a2; } 100% { background: var(--paper); } }
.row.min-row { border-left-color: color-mix(in srgb, var(--c) 72%, #000); }
.ps-legend span::before { outline: 1px solid #0e0806; }
.ps-bar i { border-right: 1px solid #0e0806; }
.modal { background: var(--leather-2); border: 2px solid #0e0806; box-shadow: inset 0 0 0 2px var(--stitch), 0 6px 0 rgba(0,0,0,.5); }
.modal.intro { background: var(--paper); color: var(--paper-ink); box-shadow: inset 0 0 0 2px var(--paper-edge), 0 6px 0 rgba(0,0,0,.5); }
.modal.intro p { color: var(--paper-ink); }
.modal.intro h2 { color: #8f5e10; text-shadow: 0 2px 0 rgba(255,255,255,.5); }
.modal.intro .verse { background: #e4d09c; border-left-color: #b3262e; color: var(--paper-ink); }
.modal.intro .verse span { color: var(--paper-soft); }
.modal.intro .emblem { filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }

/* the top bar uses the same paper plates as the cards below */
#hud .stat, #hud .icon-btn, .sh-streak, .sh-momentum {
  background: var(--paper); color: var(--paper-ink); border: 2px solid #0e0806;
  box-shadow: inset 0 0 0 1px var(--paper-edge), inset 0 3px 0 rgba(255,255,255,.35), 0 3px 0 #0e0806;
}

.sh-pips i.on { background: #c79a2e; border-color: #8f5e10; }
.sh-track { background: #3a2a1c; border-color: #0e0806; }
#hud { padding-bottom: 8px; }
.stat-rate.changing { color: var(--paper-green); }
.ministry-strip button { background: var(--paper); color: var(--paper-ink); border: 2px solid #0e0806; box-shadow: inset 0 0 0 1px var(--paper-edge), 0 2px 0 #0e0806; }
.ministry-strip .sc i { color: var(--paper-gold); }
.verse-btn { background: var(--paper); color: var(--paper-ink); border: 2px solid #0e0806; box-shadow: inset 0 0 0 1px var(--paper-edge), 0 2px 0 #0e0806; }
.verse-btn .v-ref { color: #2c5a8a; }
.verse-btn .v-name { color: var(--paper-ink); }
.verse-btn.fits { box-shadow: inset 0 0 0 2px #c79a2e, 0 2px 0 #0e0806; }
@keyframes seedPulse { 0% { transform: scale(1.12); color: #b5651d; } 100% { transform: scale(1); } }

@media (max-height: 640px) {

  .nav-btn { min-height: 52px; gap: 2px; padding-top: 3px; padding-bottom: 3px; }
  #nav { padding-top: 4px; padding-bottom: calc(4px + var(--safe-bottom)); }
  .street-status { padding: 4px 8px; }
  .street-status .goal-text { font-size: .8rem; -webkit-line-clamp: 1; }
  .ministry-strip button { min-height: 44px; }
}

/* ================= Accessibility pass: every text/background pair at WCAG AA (4.5:1), visible keyboard focus ================= */
:root { --paper-ink: #24160c; --paper-soft: #54401f; --paper-gold: #7a4a08; --paper-green: #1f5a22; --muted-on-dark: #c8bda6; }
/* paper cards: darker secondary text, chips with dark text on light tints */
.row .desc, .row .perf, .note, .note.teaser, .passive-summary .ps-label, .ps-legend, .row .eta, #boss-row .b-prep, .row .prod small, .passive-summary .ps-total small { color: var(--paper-soft); }
.note.teaser { font-style: italic; }
.row .name small, .row .prod b, .passive-summary .ps-total b, .ministry-strip .sc i, .goal-label, .street-status .goal-label { color: var(--paper-gold); }
.row.up-row .chip { background: color-mix(in srgb, var(--stripe) 38%, #fff3d0); color: #24160c; border: 1px solid color-mix(in srgb, var(--stripe) 70%, #000); }
.row.up-row .chip.best { background: #8f1c24; color: #fff6dc; border-color: #5a1015; }
.row.locked .name, .row.locked .desc { color: var(--paper-soft); }
.stat-value { color: #6a3f06; }
@keyframes seedPulse { 0% { transform: scale(1.12); color: #8f5410; } 100% { transform: scale(1); } }
/* disabled and locked buttons: still readable, clearly inactive (muted, flat, no bevel) */
.row .buy:disabled, .row .buy:disabled small, .btn:disabled, .action:disabled { color: #e6dcc6; }
.row .buy:disabled { background: #5c5148; box-shadow: inset 0 0 0 1px #7a6e62; }
.btn:disabled { filter: none; background: #5c5148; box-shadow: inset 0 0 0 1px #7a6e62; }
.action:disabled, .action.secondary:disabled { filter: none; }
#btn-word:disabled .a-title, #btn-word:disabled .a-sub { color: #e6dcc6; }
/* dark surfaces */
.faith-reveal .stat-label, .faith-reveal .label, .faith-reveal .desc { color: var(--muted-on-dark); }
.faith-reveal { background: #2c1f24; }
.modal .muted, .modal small, .modal .desc, .modal h3, .section-title, .tab > .section-title span { color: var(--muted-on-dark); }
#tap-hint { color: #fff1c4; background: rgba(20,12,8,.92); }
.toast { color: #fff1d6; }
.setting .toggle { color: #f4e9d2; }
.btn.ghost { color: #f4e9d2; border-color: #a38d68; }
.assign button { background: #f6ecd2; color: #24160c; border: 2px solid #0e0806; }
.assign button.on { background: #2f8f84; color: #fff; }
/* keyboard focus: a bold gold ring on dark and a dark ring on paper */
:focus { outline: none; }
:focus-visible { outline: 3px solid #ffd45a; outline-offset: 2px; }
.row :focus-visible, .choice:focus-visible, .verse-btn:focus-visible, #hud .icon-btn:focus-visible, .ministry-strip button:focus-visible { outline-color: #1b4fd0; }
.row.locked { opacity: 1; background: #cbbb92; }
.row.locked .name, .row.locked .desc { color: #3a2a12; }
.row .buy:disabled, .btn:disabled { background: #4a4038; color: #f4ead4; }
.row .buy:disabled small, .btn:disabled small { color: #f4ead4; }
#tap-hint { background: #140c08; color: #fff6d8; animation: none; }
/* touch targets: at least 44x44 CSS px */
.buy-modes button, .setting .toggle, .btn.small, .assign button, .verse-btn { min-height: 44px; }
.buy-modes button { min-width: 48px; }
.setting .toggle { min-width: 64px; }
.setting input[type=range] { min-height: 44px; }
.setting { min-height: 48px; }
.ministry-strip button { min-height: 44px; }
#boss-row .btn { min-height: 44px; }
.note b, .note strong { color: var(--paper-ink); }
.assign button { background: #f6ecd2; color: #24160c; }
.assign button.on { background: #7fd0bc; color: #0e2a24; border-color: #0e0806; }

/* ================= The Professor: the fight should feel like a fight ================= */
.meter-track { position: relative; }
.meter-ghost { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #f6e7b0; transition: width .7s ease-out .18s; }
.meter-fill { position: relative; }
#enc-resist-wrap.hit .meter-track { animation: resistHit .3s ease-out; }
@keyframes resistHit { 0% { box-shadow: 0 0 0 2px #fff4c8, 0 0 12px 2px rgba(255,230,150,.9); } 100% { box-shadow: none; } }
.enc-portrait-frame.flinch { animation: flinch .32s ease-out; }
@keyframes flinch { 0% { transform: translate(-3px, 1px) rotate(-2deg); filter: brightness(1.6); } 30% { transform: translate(3px, -1px) rotate(2deg); } 60% { transform: translate(-1px, 0); } 100% { transform: none; filter: none; } }
body.reduce-motion #enc-resist-wrap.hit .meter-track, body.reduce-motion .enc-portrait-frame.flinch { animation: none; }
.floater.bosshit { font-family: 'IV Pixel', var(--mono); font-weight: 400; font-synthesis: none; letter-spacing: 0; color: #fff4c8; text-shadow: 0 2px 0 #7a1c1c, 0 0 10px rgba(255,200,90,.9); text-transform: none; }
.floater.bosshit.g-direct { color: #fff; text-shadow: 0 2px 0 #8f5e10, 0 0 14px rgba(255,220,120,1); }
.floater.bosshit.crit { color: #ffd45a; }
.floater.bosshit-tag { font-family: var(--mono); font-weight: 800; font-size: .7rem; letter-spacing: .16em; color: #231a06; background: #f2c860; padding: 1px 6px; border: 2px solid #0e0806; text-transform: uppercase; }
.verse-btn .v-short { display: block; white-space: normal; font-size: .72rem; line-height: 1.2; color: var(--paper-soft); }
.verse-btn .v-fit { background: #8f5e10; color: #fff6dc; }
.verse-btn.fits .v-fit { background: #2c6a2c; }
#word-tray { gap: 6px; padding: 8px; background: #2b1e18; border: 2px solid #0e0806; box-shadow: inset 0 0 0 1px var(--stitch), 0 -4px 0 rgba(0,0,0,.4); }

#boss-banner { position: absolute; left: 0; right: 0; top: 24%; z-index: 7; text-align: center; pointer-events: none; animation: bannerIn .5s cubic-bezier(.2, 1.4, .4, 1); }
#boss-banner .bb-kicker { display: inline-block; padding: 3px 12px; font-size: .7rem; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: #fff6dc; background: #8f1c24; border: 2px solid #0e0806; box-shadow: 0 3px 0 #0e0806; }
#boss-banner .bb-title { margin-top: 6px; padding: 8px 10px; font-family: 'IV Pixel', var(--mono); font-size: 28px; line-height: 1.1; letter-spacing: 0; color: #fff4c8; background: rgba(20,12,8,.88); border-top: 3px solid #f2c860; border-bottom: 3px solid #f2c860; text-shadow: 0 3px 0 #7a1c1c; }
#boss-banner.answered .bb-kicker, #boss-banner.victory .bb-kicker { background: #2c6a2c; }
#boss-banner.victory .bb-title { font-size: 35px; color: #ffe9a8; text-shadow: 0 3px 0 #8f5e10, 0 0 20px rgba(255,220,120,.9); animation: slamFlash .9s ease-in-out 3; }
@keyframes bannerIn { 0% { transform: scale(2.2); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); } }
body.reduce-motion #boss-banner, body.reduce-motion #boss-banner .bb-title { animation: none; }
@media (max-width: 359px) { #boss-banner .bb-title { font-size: 21px; } #boss-banner.victory .bb-title { font-size: 28px; } }
#moment.boss-dialog .reward { font-family: 'IV Pixel', var(--mono); font-size: 28px; color: #ffe9a8; margin: 8px 0 2px; text-shadow: 0 2px 0 #8f5e10; }
#boss-banner { top: 33%; }
#scene.boss-fight #verse-pop, #scene.boss-fight.has-slam #verse-pop { top: 62%; }
/* while pressing the Professor's argument the passages sit in the panel (not over the fight) and the goal and strip step aside */
#app.boss-press #word-tray { position: static; order: 1; margin: 0 8px 6px; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px; box-shadow: none; }
#app.boss-press #nav { order: 2; }
#app.boss-press #street-status, #app.boss-press #ministry-strip { display: none; }
#app.boss-press .verse-btn { min-height: 48px; padding: 3px 5px; }
#app.boss-press .verse-btn .v-ref { font-size: .72rem; }

/* ================= A steady world: the street canvas never changes size =================
   The canvas lives in a fixed-size "stage" pinned to the bottom of the scene. When the panel below grows or shrinks (a conversation,
   the Professor, a tab change) the scene window changes size and the stage slides with a short ease, instead of the street being
   re-laid-out and redrawn at a new size (which was the visible "jump"). */
#scene { background: #1c1a28; }
