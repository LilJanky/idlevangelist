<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14171f" />
  <title>IdleVangelist</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="frame">
    <div id="app">
      <header id="hud">
        <div class="stat stat-main" id="stat-seeds" aria-live="off">
          <span class="stat-label">Seeds</span>
          <div class="stat-line">
            <span class="stat-icon" id="seed-icon" aria-hidden="true"></span>
            <span class="stat-value" id="v-seeds">0</span>
          </div>
          <span class="stat-rate" id="v-sps">0/s</span>
        </div>
        <div id="hud-main">
          <div id="hud-meta">
            <div class="stat stat-chip hidden" id="stat-funds">
              <span class="stat-label">Provisions</span>
              <span class="stat-value" id="v-funds">0</span>
              <span class="stat-rate" id="v-fps">0/s</span>
            </div>
            <div class="stat stat-chip faith hidden" id="stat-faith">
              <span class="stat-label">Faithfulness</span>
              <span class="stat-value" id="v-faith">0</span>
            </div>
          </div>
        </div>
        <div id="street-hud" aria-label="Street momentum">
          <div class="sh-streak" id="sh-streak"><span class="sh-label">Active Witness</span><b id="sh-mult">x1.0</b><small id="sh-count"></small><i class="sh-fuse" id="sh-fuse"></i><span class="sh-pips" id="sh-pips"></span></div>
          <div class="sh-momentum" id="sh-momentum"><span class="sh-label" id="sh-mom-label">Momentum</span><div class="sh-track"><div class="sh-fill" id="sh-fill"></div></div></div>
        </div>
        <button id="btn-settings" class="icon-btn" aria-label="Settings" type="button">Menu</button>
      </header>

      <main id="scene" aria-label="Street scene">
        <div id="stage"><canvas id="world" aria-hidden="true"></canvas><div id="floaters" aria-hidden="true"></div></div>
        <div id="encounter-card" class="hidden" role="status">
          <div class="enc-main">
            <div id="enc-portrait-frame" class="enc-portrait-frame" aria-hidden="true">
              <canvas id="enc-portrait" width="48" height="48"></canvas>
            </div>
            <div class="enc-copy">
              <div class="enc-head"><span id="enc-name"></span><span id="enc-label"></span></div>
              <p id="enc-statement"></p>
              <div class="meter" id="enc-resist-wrap" aria-label="Resistance">
                <span class="meter-label">Resistance</span>
                <div class="meter-track"><div class="meter-ghost" id="enc-resist-ghost"></div><div class="meter-fill" id="enc-resist"></div></div>
                <span class="meter-num" id="enc-resist-num"></span>
              </div>
              <div class="meter timer hidden" id="enc-timer-wrap" aria-label="Time remaining in this exchange">
                <span class="meter-label">Exchange</span>
                <div class="meter-track"><div class="meter-fill time" id="enc-timer"></div></div>
              </div>
            </div>
          </div>
        </div>
        <div id="word-slam" class="hidden" aria-hidden="true"><div class="ws-tier"></div><div class="ws-crest"></div><div class="ws-mult"></div><div class="ws-total"></div><div class="ws-sub"></div></div>
        <div id="verse-pop" class="hidden" role="status" aria-live="polite"><div class="vp-text"></div><div class="vp-ref"></div></div>
        <div id="toasts" aria-live="polite"></div>
        <div id="moment" class="hidden" role="dialog" aria-live="polite"></div>
        <div id="boss-banner" class="hidden" aria-hidden="true"><div class="bb-kicker"></div><div class="bb-title"></div></div>
        <div id="tap-hint" class="hidden">Tap people with a bubble</div>
        <div id="boss-row" class="hidden"></div>
      </main>

      <section id="panel">
        <div id="tab-street" class="tab">
          <div id="boss-panel" class="hidden"></div>
          <div id="street-top-row">
            <div id="street-status" class="street-status"></div>
            <div id="action-row">
              <button id="btn-word" class="action secondary" type="button" disabled>
                <span class="a-title">Proclaim the Word</span><span class="a-sub" id="word-sub">Locked</span><i class="cd" id="word-cd"></i>
              </button>
              <button id="btn-answer" class="action secondary" type="button" disabled>
                <span class="a-title">Press on</span><span class="a-sub" id="answer-sub">Ready</span><i class="cd" id="answer-cd"></i>
              </button>
            </div>
          </div>
          <div id="ministry-strip" class="ministry-strip hidden" aria-label="Ministry overview"></div>
          <div id="choice-box" class="hidden" role="group" aria-label="Conversation"></div>
          <div id="preview-card" class="hidden"></div>
        </div>
        <div id="tab-ministry" class="tab hidden"></div>
        <div id="tab-upgrades" class="tab hidden"></div>
        <div id="tab-legacy" class="tab hidden"></div>
      </section>

      <nav id="nav" aria-label="Sections">
        <button data-tab="street" class="nav-btn active" type="button"><span class="nav-ico" data-ico="seed"></span><span>Street</span></button>
        <button data-tab="ministry" class="nav-btn" type="button"><span class="nav-ico" data-ico="team"></span><span>Ministry</span><i class="badge hidden"></i></button>
        <button data-tab="upgrades" class="nav-btn" type="button"><span class="nav-ico" data-ico="bible"></span><span>Upgrades</span><i class="badge hidden"></i></button>
        <button data-tab="legacy" class="nav-btn hidden" type="button"><span class="nav-ico" data-ico="disciple"></span><span>Legacy</span><i class="badge hidden"></i></button>
      </nav>

      <div id="word-tray" class="hidden" role="menu" aria-label="Scripture"></div>
      <div id="overlay" class="hidden"></div>
      <div id="montage" class="hidden" aria-live="polite"></div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
